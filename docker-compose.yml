services:
  db:
    image: postgres:16-alpine
    container_name: feed_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feed_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feed_password}
      POSTGRES_DB: ${POSTGRES_DB:-feed_formulation}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feed_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: feed_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      POSTGRES_USER: ${POSTGRES_USER:-feed_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feed_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-feed_formulation}
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code

volumes:
  pgdata:
